<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>·</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{--bg:#0A0A0A;--bg-alt:#111;--bg-card:#161616;--bg-input:#1c1c1c;--line:rgba(255,255,255,0.07);--line2:rgba(255,255,255,0.13);--text:#fff;--text-2:#A0A0A0;--text-3:#555;--accent:#C5F82A;--accent-d:rgba(197,248,42,0.12);--danger:#FF5C5C;--warn:#F5A623;--info:#4A9EFF;--ok:#34D399;--r:10px;--rs:6px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}

/* AUTH */
#auth{position:fixed;inset:0;z-index:999;background:#000;display:flex;align-items:center;justify-content:center}
#auth.h{display:none}
.auth-box{width:100%;max-width:300px;display:flex;flex-direction:column;gap:14px}
.auth-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin:0 auto 20px}
.auth-in{width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:var(--rs);padding:14px 16px;color:#fff;font-size:16px;font-family:inherit;letter-spacing:.12em;outline:none;text-align:center;transition:border-color 150ms}
.auth-in:focus{border-color:var(--accent)}
.auth-in.err{border-color:var(--danger)}
.auth-btn{background:var(--accent);color:#000;border:none;border-radius:var(--rs);padding:13px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer}
.auth-err{color:var(--danger);font-size:12px;text-align:center;min-height:16px}

/* LAYOUT */
#app{display:flex;height:100vh;overflow:hidden}
#app.h{display:none}
.sb{width:216px;flex-shrink:0;background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 0}
.sb-brand{padding:0 18px 20px;font-size:15px;font-weight:700;letter-spacing:-.03em;border-bottom:1px solid var(--line);margin-bottom:12px}
.sb-brand span{color:var(--accent)}
.sb-nav{flex:1;display:flex;flex-direction:column;gap:2px;padding:0 8px}
.ni{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--rs);font-size:13px;font-weight:500;color:var(--text-2);cursor:pointer;transition:background 100ms,color 100ms;user-select:none}
.ni svg{flex-shrink:0;opacity:.7}
.ni:hover{background:rgba(255,255,255,0.05);color:var(--text)}
.ni:hover svg{opacity:1}
.ni.on{background:var(--accent-d);color:var(--accent)}
.ni.on svg{opacity:1}
.sb-foot{padding:16px 18px 0;border-top:1px solid var(--line);font-size:11px;color:var(--text-3)}
.main{flex:1;overflow-y:auto;background:var(--bg-alt);display:flex;flex-direction:column}
.topbar{padding:18px 26px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:var(--bg-alt);position:sticky;top:0;z-index:10}
.topbar h1{font-size:17px;font-weight:600}
.tb-acts{display:flex;gap:8px}
.content{padding:26px;flex:1}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:var(--rs);font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;border:none;transition:opacity 120ms}
.btn:hover{opacity:.82}
.bp{background:var(--accent);color:#000}
.bg{background:rgba(255,255,255,0.06);color:var(--text);border:1px solid var(--line2)}
.bd{background:rgba(255,92,92,.12);color:var(--danger);border:1px solid rgba(255,92,92,.2)}
.bsm{padding:5px 11px;font-size:12px}
.bic{padding:6px}

/* STATS */
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.sc{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.sl{font-size:11px;font-weight:500;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.sv{font-size:26px;font-weight:700;letter-spacing:-.03em}
.sv.ac{color:var(--accent)}
.ss{font-size:11px;color:var(--text-3);margin-top:4px}

/* TABLE */
.tw{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.th{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.th h3{font-size:13px;font-weight:600}
.si{background:var(--bg-input);border:1px solid var(--line);border-radius:var(--rs);padding:7px 12px;color:var(--text);font-size:13px;font-family:inherit;outline:none;width:190px;transition:border-color 150ms}
.si:focus{border-color:var(--accent)}
.si::placeholder{color:var(--text-3)}
table{width:100%;border-collapse:collapse}
thead tr{border-bottom:1px solid var(--line)}
th{padding:9px 15px;text-align:left;font-size:11px;font-weight:500;color:var(--text-3);text-transform:uppercase;letter-spacing:.07em}
td{padding:12px 15px;font-size:13px;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background 80ms;cursor:pointer}
tbody tr:hover{background:rgba(255,255,255,0.025)}
.tn{font-weight:500}
.tm{color:var(--text-2);font-size:12px}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:500}
.b-novo{background:rgba(74,158,255,.15);color:#4A9EFF}
.b-qualificado{background:rgba(245,166,35,.15);color:#F5A623}
.b-proposta{background:rgba(167,139,250,.15);color:#A78BFA}
.b-fechado{background:rgba(52,211,153,.15);color:#34D399}
.b-perdido{background:rgba(255,92,92,.15);color:var(--danger)}
.b-ativo{background:rgba(197,248,42,.15);color:#C5F82A}
.b-inativo{background:rgba(255,255,255,.06);color:var(--text-3)}

/* FILTERS */
.fr{display:flex;gap:6px;flex-wrap:wrap;padding:11px 18px;border-bottom:1px solid var(--line)}
.fc{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:500;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--text-2);cursor:pointer;transition:all 100ms}
.fc:hover{color:var(--text)}
.fc.on{background:var(--accent-d);color:var(--accent);border-color:rgba(197,248,42,.3)}

/* KANBAN */
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px}
.kc{flex-shrink:0;width:232px;background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column}
.kch{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.kct{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.kcn{font-size:11px;background:rgba(255,255,255,.06);padding:2px 7px;border-radius:10px;color:var(--text-3)}
.kcards{padding:8px;display:flex;flex-direction:column;gap:7px;min-height:80px}
.kcard{background:var(--bg-alt);border:1px solid var(--line);border-radius:var(--rs);padding:11px 13px;cursor:pointer;transition:border-color 100ms}
.kcard:hover{border-color:var(--line2)}
.kcard-name{font-size:13px;font-weight:500;margin-bottom:3px}
.kcard-co{font-size:11px;color:var(--text-2);margin-bottom:7px}
.kcard-ft{display:flex;align-items:center;justify-content:space-between}
.kcard-val{font-size:12px;font-weight:600;color:var(--accent)}
.kcard-svc{font-size:11px;color:var(--text-3)}

/* CHART */
.cw{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:22px}
.ct{font-size:13px;font-weight:600;margin-bottom:18px}
.bc{display:flex;align-items:flex-end;gap:8px;height:110px}
.bg2{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.bar{width:100%;border-radius:4px 4px 0 0;background:var(--accent-d);border:1px solid rgba(197,248,42,.2);min-height:2px;transition:background 200ms}
.bar.cur{background:var(--accent);border-color:transparent}
.bl{font-size:10px;color:var(--text-3)}
.bv{font-size:10px;color:var(--text-2)}

/* AGENTS v2 */
.ag2{display:flex;flex-direction:column;gap:16px}
.acard2{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.acard2-top{padding:18px 20px 16px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.acard2-name{font-size:15px;font-weight:600;margin-bottom:5px}
.acard2-sub{font-size:12px;color:var(--text-3);display:flex;align-items:center;gap:8px}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--ok);flex-shrink:0;animation:pulseAnim 2s infinite}
@keyframes pulseAnim{0%,100%{box-shadow:0 0 0 0 rgba(52,211,153,.5)}60%{box-shadow:0 0 0 6px rgba(52,211,153,0)}}
.acard2-stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.astat{padding:14px 18px}
.astat+.astat{border-left:1px solid var(--line)}
.astat-val{font-size:22px;font-weight:700;letter-spacing:-.03em}
.astat-lbl{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.07em;margin-top:3px}
.acard2-foot{padding:11px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:rgba(0,0,0,.2)}
.acard2-url{font-size:11px;color:var(--text-3);font-family:ui-monospace,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
/* CONV LIST */
.conv-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:background 80ms}
.conv-row:last-child{border-bottom:none}
.conv-row:hover{background:rgba(255,255,255,.025)}
.conv-av{width:36px;height:36px;border-radius:50%;background:var(--bg-input);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--accent);flex-shrink:0}
.conv-info{flex:1;min-width:0}
.conv-name{font-size:13px;font-weight:500;margin-bottom:2px}
.conv-prev{font-size:12px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
/* CHAT */
.chat-info{display:flex;gap:20px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.15)}
.ci{display:flex;flex-direction:column;gap:2px}
.ci-l{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em}
.ci-v{font-size:13px;font-weight:500}
.chat-msgs{display:flex;flex-direction:column;gap:8px;padding:16px;max-height:400px;overflow-y:auto}
.cmsg{display:flex;flex-direction:column;max-width:78%}
.cmsg.u{align-self:flex-end;align-items:flex-end}
.cmsg.a{align-self:flex-start}
.cbubble{padding:9px 13px;border-radius:14px;font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.cmsg.u .cbubble{background:#1a3300;color:#c8f060;border-radius:14px 14px 3px 14px}
.cmsg.a .cbubble{background:var(--bg-input);border:1px solid var(--line);color:var(--text);border-radius:14px 14px 14px 3px}
.crole{font-size:10px;color:var(--text-3);padding:0 4px;margin-top:2px}

/* FAT SUMMARY */
.fs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}

/* MODAL */
.ov{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:20px}
.ov.h{display:none}
.modal{background:var(--bg-card);border:1px solid var(--line2);border-radius:var(--r);width:100%;max-width:560px;max-height:90vh;overflow-y:auto}
.modal.wide{max-width:680px}
.mh{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.mt{font-size:14px;font-weight:600}
.mx{background:none;border:none;color:var(--text-3);cursor:pointer;padding:4px;border-radius:4px;display:flex;align-items:center;justify-content:center}
.mx:hover{color:var(--text);background:rgba(255,255,255,.06)}
.mb{padding:22px;display:flex;flex-direction:column;gap:14px}
.mf{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}

/* FORM */
.fg{display:flex;flex-direction:column;gap:5px}
.fl{font-size:12px;font-weight:500;color:var(--text-2)}
.fi,.fsl,.fta{background:var(--bg-input);border:1px solid var(--line);border-radius:var(--rs);padding:9px 11px;color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:border-color 150ms;width:100%}
.fi:focus,.fsl:focus,.fta:focus{border-color:var(--accent)}
.fsl{appearance:none;cursor:pointer}
.fta{resize:vertical;min-height:76px;line-height:1.5}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:11px}

/* TOAST */
.tc{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:7px}
.toast{background:var(--bg-card);border:1px solid var(--line2);border-radius:var(--rs);padding:11px 15px;font-size:13px;display:flex;align-items:center;gap:9px;animation:tin 180ms ease-out;min-width:220px}
.toast.ok{border-left:3px solid var(--ok)}
.toast.er{border-left:3px solid var(--danger)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.empty{text-align:center;padding:44px 20px;color:var(--text-3);font-size:13px}

/* EQUIPE */
.eq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:24px}
.eq-card{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;cursor:pointer;transition:border-color 150ms,transform 100ms;user-select:none}
.eq-card:hover{border-color:var(--line2);transform:translateY(-1px)}
.eq-card.active{border-color:var(--accent);background:var(--accent-d)}
.eq-emoji{font-size:28px;margin-bottom:10px}
.eq-name{font-size:14px;font-weight:600;margin-bottom:4px}
.eq-desc{font-size:12px;color:var(--text-3);line-height:1.5}
.eq-dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:6px}
/* CHAT EQUIPE */
.eq-chat{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;height:600px}
.eq-chat-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.eq-chat-info{display:flex;align-items:center;gap:10px}
.eq-chat-ava{font-size:22px}
.eq-chat-name{font-size:14px;font-weight:600}
.eq-chat-sub{font-size:11px;color:var(--text-3);margin-top:1px}
.eq-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.eq-msg{display:flex;flex-direction:column;max-width:82%}
.eq-msg.u{align-self:flex-end;align-items:flex-end}
.eq-msg.a{align-self:flex-start}
.eq-bubble{padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.eq-msg.u .eq-bubble{background:var(--accent);color:#000;border-radius:14px 14px 3px 14px}
.eq-msg.a .eq-bubble{background:var(--bg-input);border:1px solid var(--line);color:var(--text);border-radius:14px 14px 14px 3px}
.eq-bubble.thinking{color:var(--text-3);font-style:italic}
.eq-role{font-size:10px;color:var(--text-3);margin-top:3px;padding:0 4px}
.eq-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-end}
.eq-input{flex:1;background:var(--bg-input);border:1px solid var(--line);border-radius:var(--rs);padding:10px 13px;color:var(--text);font-size:13px;font-family:inherit;resize:none;outline:none;line-height:1.5;max-height:120px;transition:border-color 150ms}
.eq-input:focus{border-color:var(--accent)}
.eq-send{background:var(--accent);border:none;border-radius:var(--rs);padding:10px 16px;color:#000;font-size:13px;font-weight:600;cursor:pointer;flex-shrink:0;transition:opacity 120ms}
.eq-send:hover{opacity:.85}
.eq-send:disabled{opacity:.4;cursor:not-allowed}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}

@media(max-width:768px){
  .sb{width:56px}
  .sb-brand,.ni span,.sb-foot{display:none}
  .ni{justify-content:center;padding:11px}
  .sg{grid-template-columns:1fr 1fr}
  .fs{grid-template-columns:1fr}
  .frow{grid-template-columns:1fr}
  .content{padding:14px}
  .topbar{padding:14px}
}
@media(max-width:480px){.sg{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth">
  <div class="auth-box">
    <div class="auth-dot"></div>
    <input type="email" class="auth-in" id="aemail" placeholder="seu@email.com" autocomplete="username" style="margin-bottom:8px">
    <input type="password" class="auth-in" id="ain" placeholder="••••••••••••••••" autocomplete="current-password">
    <button class="auth-btn" id="abtn" onclick="doAuth()">Entrar</button>
    <div class="auth-err" id="aerr"></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="h">
  <aside class="sb">
    <div class="sb-brand">Eleva <span>Digital</span></div>
    <nav class="sb-nav">
      <div class="ni" data-v="dashboard" onclick="go('dashboard')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        <span>Dashboard</span>
      </div>
      <div class="ni" data-v="clientes" onclick="go('clientes')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Clientes</span>
      </div>
      <div class="ni" data-v="pipeline" onclick="go('pipeline')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="4" height="18"/><rect x="10" y="3" width="4" height="18"/><rect x="18" y="3" width="4" height="18"/></svg>
        <span>Pipeline</span>
      </div>
      <div class="ni" data-v="faturamento" onclick="go('faturamento')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        <span>Faturamento</span>
      </div>
      <div class="ni" data-v="mensalidades" onclick="go('mensalidades')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span>Mensalidades</span>
      </div>
      <div class="ni" data-v="agentes" onclick="go('agentes')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span>Agentes IA</span>
      </div>
      <div class="ni" data-v="equipe" onclick="go('equipe')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Equipe</span>

<script>
const SB_URL = window.EL_PUBLIC?.SB_URL || 'https://flzpblpegoqjxaacjvhf.supabase.co';
const SB_ANON_KEY = window.EL_PUBLIC?.SB_ANON_KEY;

// Cliente Auth (anon) — usado só pra login/logout. Depois de logar, criamos o admin client.
const sbAuth = supabase.createClient(SB_URL, SB_ANON_KEY, {
  auth: { persistSession: true, storageKey: 'eleva_auth' },
});

// `db` e `OR_KEY` são definidos depois do login bem-sucedido (ver bootstrapAdmin).
let db = null;
let OR_KEY = '';

// ── NAV state (declarado cedo pra evitar TDZ quando startApp() chama go()) ──
let curView = 'dashboard';
let vTitles = {};
let vRenders = {};

// ── AUTH ──────────────────────────────────────
function setErr(msg) {
  document.getElementById('aerr').textContent = msg || '';
  if (msg) setTimeout(() => { document.getElementById('aerr').textContent=''; }, 4000);
}

async function bootstrapAdmin(session) {
  // Troca o JWT do user pelas chaves admin via server.js.
  const r = await fetch('/admin-config-auth', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + session.access_token, 'Content-Type': 'application/json' },
    body: '{}',
  });
  if (!r.ok) {
    if (r.status === 403) throw new Error('Email não autorizado.');
    if (r.status === 401) throw new Error('Sessão inválida.');
    throw new Error('Server respondeu ' + r.status);
  }
  const cfg = await r.json();
  if (!cfg.ok || !cfg.SB_KEY) throw new Error('Server não devolveu as chaves.');
  db = supabase.createClient(SB_URL, cfg.SB_KEY);
  OR_KEY = cfg.OR_KEY || '';
  window.db = db; // expõe pra views já carregadas
}

async function doAuth() {
  const email = document.getElementById('aemail').value.trim();
  const password = document.getElementById('ain').value;
  const btn = document.getElementById('abtn');
  if (!email || !password) return setErr('Preenche email e senha.');
  btn.disabled = true; btn.textContent = 'Entrando…';
  try {
    const { data, error } = await sbAuth.auth.signInWithPassword({ email, password });
    if (error) throw error;
    await bootstrapAdmin(data.session);
    startApp();
  } catch (e) {
    setErr(e.message || 'Erro ao entrar.');
    btn.disabled = false; btn.textContent = 'Entrar';
  }
}

async function doLogout() {
  try { await sbAuth.auth.signOut(); } catch (_) {}
  location.reload();
}
window.doLogout = doLogout;

document.getElementById('ain').addEventListener('keydown', e => { if(e.key==='Enter') doAuth(); });
document.getElementById('aemail').addEventListener('keydown', e => { if(e.key==='Enter') doAuth(); });

function startApp() {
  document.getElementById('auth').classList.add('h');
  document.getElementById('app').classList.remove('h');
  go('dashboard');
  startRealtime();
}

// Auto-login: se já tem sessão Supabase válida, tenta bootstrap direto.
async function tryAutoLogin() {
  const { data } = await sbAuth.auth.getSession();
  if (!data?.session) return;
  try {
    await bootstrapAdmin(data.session);
    startApp();
  } catch (e) {
    // sessão existe mas o server rejeitou (email não autorizado, etc) — força login manual
    await sbAuth.auth.signOut();
  }
}

// ── REALTIME ──────────────────────────────────
function startRealtime() {
  // Tabelas que disparam re-render da view atual
  const reloadMap = {
    chatbot_conversations: ['agentes','dashboard'],
    clientes:              ['clientes','pipeline','mensalidades','dashboard'],
    faturamento:           ['faturamento','mensalidades','dashboard'],
    agentes:               ['agentes'],
    conhecimentos:         ['agentes'],
  };
  let reloadTimer = null;
  function scheduleReload(view) {
    if (curView !== view) return;
    clearTimeout(reloadTimer);
    reloadTimer = setTimeout(() => vRenders[curView]?.(), 800);
  }
  Object.entries(reloadMap).forEach(([table, views]) => {
    db.channel(`rt-${table}`)
      .on('postgres_changes', { event: '*', schema: 'public', table }, () => {
        views.forEach(v => scheduleReload(v));
      })
      .subscribe();
  });
}

vTitles = { dashboard:'Dashboard', clientes:'Clientes', pipeline:'Pipeline', mensalidades:'Mensalidades', faturamento:'Faturamento', agentes:'Agentes IA', equipe:'Equipe de Conteúdo', documentos:'Documentos' };
vRenders = { dashboard:renderDash, clientes:renderClientes, pipeline:renderPipeline, mensalidades:renderMensalidades, faturamento:renderFat, agentes:renderAgentes, equipe:renderEquipe, documentos:renderDocumentos };

}

// ── UTILS ─────────────────────────────────────
const MES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const MESF = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const STATS = ['novo','qualificado','proposta','ativo','fechado','perdido'];
const CANAIS = ['WhatsApp','Instagram','Site','Telegram','Email','Outro'];

function brl(v) {
  if (!v && v !== 0) return '—';
  return 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtd(iso) { if (!iso) return '—'; return new Date(iso).toLocaleDateString('pt-BR'); }
function badge(s) { return `<span class="badge b-${s}">${s.charAt(0).toUpperCase()+s.slice(1)}</span>`; }
function bk(v) { return v >= 1000 ? (v/1000).toFixed(1)+'k' : String(Math.round(v)); }

// ── DASHBOARD ─────────────────────────────────
async function renderDash() {
  const c = document.getElementById('content');
  c.innerHTML = '<div class="empty">Carregando...</div>';
  const now = new Date(); const mes = now.getMonth()+1; const ano = now.getFullYear();
  const [{ data: cl },{ data: fat },{ data: ag }] = await Promise.all([
    db.from('clientes').select('*').order('criado_em',{ascending:false}),
    db.from('faturamento').select('*'),
    db.from('agentes').select('*'),
  ]);
  const clientes = cl||[], fats = fat||[], agentes = ag||[];
  const ativos = clientes.filter(x => x.status === 'ativo').length;
  const mrr = clientes.filter(x => x.status === 'ativo').reduce((s,x) => s + Number(x.valor||0), 0);
  const novos = clientes.filter(x => { const d=new Date(x.criado_em); return d.getMonth()+1===mes&&d.getFullYear()===ano; }).length;
  const agAtivos = agentes.filter(a => a.status==='ativo').length;
  const fatMes = fats.filter(f => f.mes===mes&&f.ano===ano).reduce((s,f)=>s+Number(f.valor),0);

  const chart = [];
  for (let i=5; i>=0; i--) {
    const d = new Date(ano, mes-1-i, 1);
    const m = d.getMonth()+1, y = d.getFullYear();
    const val = fats.filter(f=>f.mes===m&&f.ano===y).reduce((s,f)=>s+Number(f.valor),0);
    chart.push({label:MES[m-1], val, cur:i===0});
  }
  const maxV = Math.max(...chart.map(d=>d.val),1);

  c.innerHTML = `
    <div class="sg">
      <div class="sc"><div class="sl">Faturamento — ${MES[mes-1]}</div><div class="sv ac">${brl(fatMes)}</div><div class="ss">${MESF[mes-1]} ${ano}</div></div>
      <div class="sc"><div class="sl">MRR</div><div class="sv ac">${brl(mrr)}</div><div class="ss">${ativos} cliente(s) ativo(s)</div></div>
      <div class="sc"><div class="sl">Leads este mês</div><div class="sv">${novos}</div><div class="ss">${MES[mes-1]} ${ano}</div></div>
      <div class="sc"><div class="sl">Agentes IA ativos</div><div class="sv">${agAtivos}</div><div class="ss">Em operação</div></div>
    </div>
    <div class="cw">
      <div class="ct">Faturamento — últimos 6 meses</div>
      <div class="bc">
        ${chart.map(d=>`
          <div class="bg2">
            <div class="bv">${d.val>0?'R$'+bk(d.val):''}</div>
            <div class="bar${d.cur?' cur':''}" style="height:${Math.round(d.val/maxV*100)}%"></div>
            <div class="bl">${d.label}</div>
          </div>
        `).join('')}
      </div>
    </div>
    <div class="tw">
      <div class="th"><h3>Últimos clientes</h3><button class="btn bg bsm" onclick="go('clientes')">Ver todos →</button></div>
      <table>
        <thead><tr><th>Nome</th><th>Empresa</th><th>Serviço</th><th>Status</th><th>Valor</th></tr></thead>
        <tbody>
          ${clientes.slice(0,6).map(x=>`
            <tr onclick="go('clientes')">
              <td class="tn">${x.nome}</td><td class="tm">${x.empresa||'—'}</td><td class="tm">${x.servico||'—'}</td>
              <td>${badge(x.status)}</td><td>${brl(x.valor)}</td>
            </tr>`).join('') || '<tr><td colspan="5"><div class="empty">Sem clientes ainda.</div></td></tr>'}
        </tbody>
      </table>
    </div>`;
}

        </tbody>
      </table>

}

function clForm(x={}) {
  return `
    <div class="frow">
      <div class="fg"><label class="fl">Nome *</label><input class="fi" id="fn" value="${x.nome||''}"></div>

function addCliente() { openModal('Novo cliente', clForm(), `<button class="btn bg" onclick="closeModal()">Cancelar</button><button class="btn bp" onclick="saveCliente()">Salvar</button>`); }
function editCliente(id) {
  const x = window._cl.find(c=>c.id===id); if(!x) return;
  openModal('Editar cliente', clForm(x), `<button class="btn bg" onclick="closeModal()">Cancelar</button><button class="btn bp" onclick="saveCliente('${id}')">Salvar</button>`);
}
async function saveCliente(id) {
  const d = { nome:document.getElementById('fn').value.trim(), empresa:document.getElementById('fe').value.trim(), whatsapp:document.getElementById('fw').value.trim(), email:document.getElementById('fem').value.trim(), servico:document.getElementById('fs').value.trim(), valor:parseFloat(document.getElementById('fv').value)||null, status:document.getElementById('fst').value, observacoes:document.getElementById('fob').value.trim(), atualizado_em:new Date().toISOString() };
  if (!d.nome) { toast('Nome obrigatório.','er'); return; }
  const { error } = id ? await db.from('clientes').update(d).eq('id',id) : await db.from('clientes').insert(d);
  if (error) { toast('Erro ao salvar.','er'); return; }
  toast(id ? 'Cliente atualizado.' : 'Cliente adicionado.');
  closeModal();
  if (curView==='pipeline') renderPipeline(); else renderClientes();
}
async function delCliente(id) {
  if (!confirm('Remover este cliente?')) return;
  const { error } = await db.from('clientes').delete().eq('id',id);
  if (error) { toast('Erro.','er'); return; }
  toast('Removido.');
  renderClientes();
}

function fatForm(f={}) {
  const now = new Date();
  return `

async function renderMensalidades() {
  document.getElementById('tbacts').innerHTML = `<button class="btn bp" onclick="addCliente()">+ Novo cliente</button>`;

  c.innerHTML = '<div class="empty">Carregando...</div>';

    db.from('clientes').select('*').order('nome',{ascending:true}),
    db.from('faturamento').select('*').eq('mes',mes).eq('ano',ano),
  ]);
  const ativos = (cl||[]).filter(x => x.status === 'ativo');
  const fats = fat||[];
  const mrr = ativos.reduce((s,x) => s + Number(x.valor||0), 0);
  const recebido = fats.reduce((s,f) => s + Number(f.valor||0), 0);
  const pendente = Math.max(0, mrr - recebido);

  // check which clients already have a payment this month (by name in descricao)
  const pagoIds = new Set(fats.map(f => (f.cliente_id||null)).filter(Boolean));

  c.innerHTML = `
    <div class="sg" style="grid-template-columns:repeat(4,1fr)">
      <div class="sc"><div class="sl">MRR</div><div class="sv ac">${brl(mrr)}</div><div class="ss">Recorrência mensal</div></div>
      <div class="sc"><div class="sl">Clientes ativos</div><div class="sv">${ativos.length}</div><div class="ss">Com contrato vigente</div></div>
      <div class="sc"><div class="sl">Recebido em ${MES[mes-1]}</div><div class="sv" style="color:var(--ok)">${brl(recebido)}</div><div class="ss">${fats.length} lançamento(s)</div></div>
      <div class="sc"><div class="sl">Pendente</div><div class="sv" style="color:${pendente>0?'var(--warn)':'var(--text-3)'}">${brl(pendente)}</div><div class="ss">${pendente>0?'A receber':'Em dia'}</div></div>
    </div>

    <div class="tw" style="margin-bottom:22px">
      <div class="th">
        <h3>Clientes ativos <span style="color:var(--text-3);font-weight:400">(${ativos.length})</span></h3>
        <span style="font-size:12px;color:var(--text-3)">Clique em "Registrar" para lançar o pagamento do mês</span>
      </div>
      ${ativos.length ? `
      <table>
        <thead><tr><th>Nome</th><th>Empresa</th><th>Serviço</th><th>Valor/mês</th><th>${MES[mes-1]}/${ano}</th><th></th></tr></thead>
        <tbody>
          ${ativos.map(x => {
            const jaPagou = fats.some(f => f.cliente_id === x.id);
            return `<tr>
              <td class="tn">${x.nome}</td>
              <td class="tm">${x.empresa||'—'}</td>
              <td class="tm">${x.servico||'—'}</td>
              <td style="font-weight:600;color:var(--accent)">${brl(x.valor)}</td>
              <td>${jaPagou ? '<span class="badge b-ativo">Pago</span>' : '<span class="badge b-inativo">Pendente</span>'}</td>
              <td>
                ${jaPagou
                  ? `<button class="btn bg bsm" onclick="estornarMens('${x.id}','${x.nome}',${mes},${ano})">Estornar</button>`
                  : `<button class="btn bp bsm" onclick="registrarMens('${x.id}','${x.nome}',${x.valor||0},${mes},${ano})">Registrar</button>`
                }
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>` : '<div class="empty">Nenhum cliente com status "Ativo".<br>Altere o status do cliente para <strong>Ativo</strong> para aparecer aqui.</div>'}
    </div>

    <div class="tw">
      <div class="th">
        <h3>Lançamentos — ${MESF[mes-1]} ${ano}</h3>

            </tr>`).join('')
          : '<tr><td colspan="4"><div class="empty">Sem lançamentos este mês.</div></td></tr>'}
        </tbody>
      </table>
    </div>`;

async function registrarMens(clienteId, nome, valor, mes, ano) {

async function delFatMens(id) {

}

function buildConvList(list) {
  if (!list.length) return '<div class="empty">Nenhuma conversa ainda.<br>Quando alguém mandar mensagem no WhatsApp, aparece aqui.</div>';
  return list.map(cv=>{
    const nome = cv.lead_data?.nome || cv.phone;
    const emp  = cv.lead_data?.empresa ? ` · ${cv.lead_data.empresa}` : '';
    const msgs = cv.messages||[];
    const last = msgs[msgs.length-1];
    const prev = (last?.content||'').replace(/\n/g,' ').slice(0,55)||(last?'…':'—');
    const ini  = nome.charAt(0).toUpperCase();
    const int  = cv.lead_data?.interesse||'indefinido';
    return `<div class="conv-row" onclick="viewConversa('${cv.phone}')">
      <div class="conv-av">${ini}</div>
      <div class="conv-info">
        <div class="conv-name">${nome}<span style="color:var(--text-3);font-weight:400">${emp}</span></div>
        <div class="conv-prev">${prev}</div>
      </div>
      <div class="conv-meta">
        <span style="font-size:11px;padding:2px 8px;border-radius:10px;background:${STAGE_CLR[cv.stage]||'#555'}22;color:${STAGE_CLR[cv.stage]||'#555'}">${STAGE_LABEL[cv.stage]||cv.stage}</span>
        <span style="font-size:10px;color:${INTER_CLR[int]||'var(--text-3)'}">${int}</span>
        <span style="font-size:10px;color:var(--text-3)">${fmtd(cv.updated_at)}</span>
      </div>
    </div>`;
  }).join('');
}

function filterConvs(q) {
  const f = q ? window._convs.filter(c=>(c.lead_data?.nome||'').toLowerCase().includes(q.toLowerCase())||c.phone.includes(q)) : window._convs;
  const el = document.getElementById('convList');
  if (el) el.innerHTML = buildConvList(f);
}

function viewConversa(phone) {
  const cv = window._convs.find(c=>c.phone===phone); if(!cv) return;
  const nome = cv.lead_data?.nome||phone;
  const msgs = cv.messages||[];
  const ld   = cv.lead_data||{};
  const infos = [
    ld.nome      && ['Nome',ld.nome],
    ld.empresa   && ['Empresa',ld.empresa],
    ld.segmento  && ['Segmento',ld.segmento],
    ld.faturamento && ['Faturamento',ld.faturamento],
    ld.interesse && ['Interesse',ld.interesse],
    ['WhatsApp', phone],
    ['Estágio', STAGE_LABEL[cv.stage]||cv.stage],
    ld.dores?.length && ['Dores', ld.dores.join(', ')],
  ].filter(Boolean);
  const body = `
    <div class="chat-info">${infos.map(([l,v])=>`<div class="ci"><div class="ci-l">${l}</div><div class="ci-v">${v}</div></div>`).join('')}</div>
    <div class="chat-msgs">${msgs.length
      ? msgs.map(m=>`<div class="cmsg ${m.role==='user'?'u':'a'}"><div class="cbubble">${m.content}</div><div class="crole">${m.role==='user'?'Lead':'Assistente'}</div></div>`).join('')
      : '<div class="empty" style="padding:20px">Sem mensagens registradas.</div>'
    }</div>`;
  openModal(nome, body, `<button class="btn bg" onclick="closeModal()">Fechar</button><a href="https://wa.me/${phone.replace(/\D/g,'')}" target="_blank" class="btn bp">Abrir no WhatsApp</a>`);
  setTimeout(()=>{ const el=document.querySelector('.chat-msgs'); if(el) el.scrollTop=el.scrollHeight; },50);
}

let eqActive = null;
let eqChats = {}; // { agentId: [{role, content}] }
let eqLoading = false;

async function renderEquipe() {
  document.getElementById('tbacts').innerHTML = `<button class="btn bg bsm" onclick="eqClear()">Limpar conversa</button>`;
  const c = document.getElementById('content');
  if (!eqActive) eqActive = EQ_AGENTS[0].id;
  eqRender(c);
}

function eqRender(c) {
  c = c || document.getElementById('content');
  const agent = EQ_AGENTS.find(a => a.id === eqActive);
  const msgs = eqChats[eqActive] || [];
  c.innerHTML = `
    <div class="eq-grid">
      ${EQ_AGENTS.map(a=>`
        <div class="eq-card${a.id===eqActive?' active':''}" onclick="eqSelect('${a.id}')">
          <div class="eq-emoji">${a.emoji}</div>
          <div class="eq-name">${a.name}</div>
          <div class="eq-desc">${a.desc}</div>
          <div style="margin-top:10px"><span class="eq-dot" style="background:${a.color}"></span><span style="font-size:11px;color:var(--text-3)">${a.model.split('/')[0]}</span></div>
        </div>`).join('')}
    </div>
    <div class="eq-chat">
      <div class="eq-chat-head">
        <div class="eq-chat-info">
          <div class="eq-chat-ava">${agent.emoji}</div>
          <div>
            <div class="eq-chat-name">${agent.name}</div>
            <div class="eq-chat-sub">${agent.desc}</div>
          </div>
        </div>
        <button class="btn bg bsm" onclick="eqClear()">Limpar</button>
      </div>
      <div class="eq-msgs" id="eqMsgs">
        ${msgs.length ? msgs.map(m=>`
          <div class="eq-msg ${m.role==='user'?'u':'a'}">
            <div class="eq-bubble">${m.content}</div>
            <div class="eq-role">${m.role==='user'?'Você':agent.name}</div>
          </div>`).join('')
        : `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:12px;color:var(--text-3);text-align:center;padding:40px 20px">
            <div style="font-size:40px">${agent.emoji}</div>
            <div style="font-size:14px;font-weight:500;color:var(--text-2)">${agent.name}</div>
            <div style="font-size:13px;max-width:340px;line-height:1.6">${agent.desc}</div>
            <div style="font-size:11px;margin-top:8px;padding:4px 12px;border-radius:20px;background:rgba(255,255,255,.05);border:1px solid var(--line)">${agent.model}</div>
          </div>`}
      </div>
      <div class="eq-foot">
        <textarea class="eq-input" id="eqInput" placeholder="Fale com ${agent.name}..." rows="1"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();eqSend()}"
          oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'"></textarea>
        <button class="eq-send" id="eqSend" onclick="eqSend()">Enviar</button>
      </div>
    </div>`;
  eqScrollBottom();
  setTimeout(()=>{ const el=document.getElementById('eqInput'); if(el) el.focus(); },100);
}

function eqSelect(id) {
  eqActive = id;
  eqRender();
}

function eqClear() {
  eqChats[eqActive] = [];
  eqRender();
  toast('Conversa limpa.');
}

function eqScrollBottom() {
  setTimeout(()=>{ const el=document.getElementById('eqMsgs'); if(el) el.scrollTop=el.scrollHeight; },50);
}

function eqAppendMsg(role, content) {
  const container = document.getElementById('eqMsgs');
  if (!container) return;
  // remove empty state if present
  const empty = container.querySelector('div[style*="flex-direction:column"]');
  if (empty) empty.remove();
  const agent = EQ_AGENTS.find(a=>a.id===eqActive);
  const div = document.createElement('div');
  div.className = `eq-msg ${role==='user'?'u':'a'}`;
  div.innerHTML = `<div class="eq-bubble">${content}</div><div class="eq-role">${role==='user'?'Você':agent.name}</div>`;
  container.appendChild(div);
  eqScrollBottom();
  return div;
}

async function eqSend() {
  if (eqLoading) return;
  if (!OR_KEY) { toast('Configure OR_KEY no código (chave OpenRouter).','er'); return; }
  const input = document.getElementById('eqInput');
  const text = (input?.value||'').trim();
  if (!text) return;
  input.value = '';
  input.style.height = 'auto';

  const agent = EQ_AGENTS.find(a=>a.id===eqActive);
  if (!eqChats[eqActive]) eqChats[eqActive] = [];
  eqChats[eqActive].push({ role:'user', content: text });
  eqAppendMsg('user', text);

  eqLoading = true;
  const sendBtn = document.getElementById('eqSend');
  if (sendBtn) { sendBtn.disabled = true; sendBtn.textContent = '...'; }

  // add thinking bubble
  const thinking = eqAppendMsg('assistant', '');
  if (thinking) thinking.querySelector('.eq-bubble').classList.add('thinking');
  if (thinking) thinking.querySelector('.eq-bubble').textContent = agent.name + ' está pensando...';

  try {
    const messages = eqChats[eqActive].map(m=>({ role: m.role, content: m.content }));
    const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${OR_KEY}`,
        'Content-Type': 'application/json',
        'HTTP-Referer': location.href,
        'X-Title': 'Eleva Digital CRM — Equipe de Conteúdo'
      },
      body: JSON.stringify({
        model: agent.model,
        messages: [
          { role: 'system', content: agent.system },
          ...messages
        ],
        temperature: 0.8,
        max_tokens: 2048
      })
    });
    if (!res.ok) { const err = await res.text(); throw new Error(err); }
    const data = await res.json();
    const reply = data.choices?.[0]?.message?.content || '(sem resposta)';

    eqChats[eqActive].push({ role:'assistant', content: reply });

    if (thinking) {
      thinking.querySelector('.eq-bubble').classList.remove('thinking');
      thinking.querySelector('.eq-bubble').textContent = reply;
    }

    // persist to DB (best effort)
    db.from('content_chats').insert({
      agent_id: eqActive,
      agent_name: agent.name,
      messages: eqChats[eqActive]
    }).then(()=>{}).catch(()=>{});

  } catch(err) {
    console.error(err);
    if (thinking) {
      thinking.querySelector('.eq-bubble').classList.remove('thinking');
      thinking.querySelector('.eq-bubble').textContent = 'Erro ao conectar com a IA. Verifique a chave OpenRouter.';
    }
    eqChats[eqActive].pop(); // remove failed assistant msg
    toast('Erro na IA. Verifique OR_KEY.','er');
  } finally {
    eqLoading = false;
    if (sendBtn) { sendBtn.disabled = false; sendBtn.textContent = 'Enviar'; }
  }
}

// ── DOCUMENTOS ────────────────────────────────────────────
const DOC_BUCKET = 'documentos';
const DOC_TIPOS = [
  { v:'identidade', label:'Identidade Visual' },
  { v:'roteiro',    label:'Roteiros' },
  { v:'briefing',   label:'Briefings' },
  { v:'contrato',   label:'Contratos' },
  { v:'proposta',   label:'Propostas' },
  { v:'criativo',   label:'Criativos / Mídia' },
  { v:'outro',      label:'Outros' },
];
let docFiltroCliente = '';
let docFiltroTipo    = '';

async function renderDocumentos() {
  const c = document.getElementById('content');
  document.getElementById('tbacts').innerHTML = `<button class="btn bg bsm" onclick="docNovo()">+ Novo documento</button>`;
  c.innerHTML = `
    <div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center">
      <select id="doc-fc" class="fi" style="max-width:240px"><option value="">Todos os clientes</option></select>
      <select id="doc-ft" class="fi" style="max-width:200px">
        <option value="">Todos os tipos</option>
        ${DOC_TIPOS.map(t=>`<option value="${t.v}">${t.label}</option>`).join('')}
      </select>
      <span id="doc-count" style="font-size:12px;color:var(--text-3)"></span>
    </div>
    <div id="doc-list" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px"></div>
  `;

  // Carrega lista de clientes pro filtro/seletor
  const { data: clientes } = await db.from('clientes').select('id, nome, empresa').order('nome');
  const fc = document.getElementById('doc-fc');
  (clientes||[]).forEach(cl => {
    const label = cl.empresa ? `${cl.nome} (${cl.empresa})` : cl.nome;
    fc.insertAdjacentHTML('beforeend', `<option value="${cl.id}">${label}</option>`);
  });
  fc.value = docFiltroCliente;
  document.getElementById('doc-ft').value = docFiltroTipo;
  fc.onchange = () => { docFiltroCliente = fc.value; docCarregarLista(clientes); };
  document.getElementById('doc-ft').onchange = (e) => { docFiltroTipo = e.target.value; docCarregarLista(clientes); };

  docCarregarLista(clientes);
}

async function docCarregarLista(clientes) {
  const list = document.getElementById('doc-list');
  list.innerHTML = `<div style="color:var(--text-3);font-size:13px">Carregando...</div>`;

  let q = db.from('documentos').select('*').order('criado_em', { ascending:false });
  if (docFiltroCliente) q = q.eq('cliente_id', docFiltroCliente);
  if (docFiltroTipo)    q = q.eq('tipo', docFiltroTipo);
  const { data, error } = await q;

  if (error) {
    list.innerHTML = `<div style="color:#ff8080;font-size:13px;grid-column:1/-1">
      Erro: ${error.message}.<br>Rode <code>supabase/documentos-schema.sql</code> no SQL Editor pra criar a tabela e o bucket.
    </div>`;
    return;
  }

  document.getElementById('doc-count').textContent = `${data.length} documento${data.length===1?'':'s'}`;
  if (!data.length) {
    list.innerHTML = `<div style="color:var(--text-3);font-size:13px;grid-column:1/-1;text-align:center;padding:40px 0">
      Nenhum documento ainda. Clique em <b>+ Novo documento</b> pra subir o primeiro.
    </div>`;
    return;
  }

  const clienteMap = Object.fromEntries((clientes||[]).map(c=>[c.id, c.empresa || c.nome]));
  list.innerHTML = data.map(d => {
    const tipoLabel = (DOC_TIPOS.find(t=>t.v===d.tipo)||{label:d.tipo}).label;
    const sizeKb = d.tamanho ? Math.round(d.tamanho/1024) + ' KB' : '';
    const data_str = new Date(d.criado_em).toLocaleDateString('pt-BR');
    return `<div style="background:var(--bg-card);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:6px">
      <div style="display:flex;align-items:center;gap:8px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <div style="font-weight:600;font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${d.nome}</div>
      </div>
      <div style="font-size:11px;color:var(--text-3);display:flex;gap:8px;flex-wrap:wrap">
        <span>${tipoLabel}</span>
        ${d.cliente_id ? `<span>· ${clienteMap[d.cliente_id]||'(cliente removido)'}</span>` : ''}
        <span>· ${data_str}</span>
        ${sizeKb ? `<span>· ${sizeKb}</span>` : ''}
      </div>
      ${d.descricao ? `<div style="font-size:12px;color:var(--text-2);margin-top:4px">${d.descricao}</div>` : ''}
      <div style="display:flex;gap:6px;margin-top:8px">
        <button class="btn bg bsm" style="flex:1" onclick="docAbrir('${d.id}','${d.storage_path.replace(/'/g,"\\'")}')">Abrir</button>
        <button class="btn bg bsm" onclick="docRemover('${d.id}','${d.storage_path.replace(/'/g,"\\'")}')">Remover</button>
      </div>
    </div>`;
  }).join('');
}

function docNovo() {
  openModal('Novo documento', `
    <div class="fg"><label class="fl">Arquivo</label><input type="file" id="dn-file" class="fi"></div>
    <div class="fg"><label class="fl">Tipo</label>
      <select id="dn-tipo" class="fi">${DOC_TIPOS.map(t=>`<option value="${t.v}">${t.label}</option>`).join('')}</select>
    </div>
    <div class="fg"><label class="fl">Cliente (opcional)</label><select id="dn-cliente" class="fi"><option value="">— Sem cliente —</option></select></div>
    <div class="fg"><label class="fl">Descrição (opcional)</label><textarea id="dn-desc" class="fi" rows="2"></textarea></div>
    <div id="dn-status" style="font-size:12px;color:var(--text-3);margin-top:6px"></div>
  `, `<button class="btn bg" onclick="closeModal()">Cancelar</button><button class="btn bp" onclick="docSalvar()">Enviar</button>`);

  // Popula select de clientes
  db.from('clientes').select('id, nome, empresa').order('nome').then(({data}) => {
    const sel = document.getElementById('dn-cliente');
    (data||[]).forEach(cl => {
      const label = cl.empresa ? `${cl.nome} (${cl.empresa})` : cl.nome;
      sel.insertAdjacentHTML('beforeend', `<option value="${cl.id}">${label}</option>`);
    });
  });
}

async function docSalvar() {
  const file = document.getElementById('dn-file').files[0];
  if (!file) { toast('Selecione um arquivo.','er'); return; }
  if (file.size > 50 * 1024 * 1024) { toast('Máximo 50MB.','er'); return; }

  const tipo = document.getElementById('dn-tipo').value;
  const cliente_id = document.getElementById('dn-cliente').value || null;
  const descricao = document.getElementById('dn-desc').value.trim();
  const status = document.getElementById('dn-status');

  status.textContent = 'Enviando...';

  // Gera path único: tipo/timestamp-nome.ext
  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
  const storage_path = `${tipo}/${Date.now()}-${safeName}`;

  const { error: upErr } = await db.storage.from(DOC_BUCKET).upload(storage_path, file, { upsert:false });
  if (upErr) { status.textContent = ''; toast('Erro no upload: ' + upErr.message,'er'); return; }

  const { error: dbErr } = await db.from('documentos').insert({
    nome: file.name,
    tipo,
    cliente_id,
    descricao,
    storage_path,
    mime_type: file.type || null,
    tamanho: file.size,
  });
  if (dbErr) {
    await db.storage.from(DOC_BUCKET).remove([storage_path]); // rollback
    status.textContent = '';
    toast('Erro ao salvar: ' + dbErr.message,'er');
    return;
  }

  closeModal();
  toast('Documento adicionado.');
  renderDocumentos();
}

async function docAbrir(id, storage_path) {
  const { data, error } = await db.storage.from(DOC_BUCKET).createSignedUrl(storage_path, 3600);
  if (error || !data?.signedUrl) { toast('Erro: ' + (error?.message||'sem URL'),'er'); return; }
  window.open(data.signedUrl, '_blank');
}

async function docRemover(id, storage_path) {
  if (!confirm('Remover este documento? A ação não pode ser desfeita.')) return;
  await db.storage.from(DOC_BUCKET).remove([storage_path]);
  await db.from('documentos').delete().eq('id', id);
  toast('Removido.');
  renderDocumentos();
}
