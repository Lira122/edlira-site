<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Como funciona — Eleva Digital</title>
  <style>
    html, body, #root { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; }
    body {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: #fff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
      position: fixed;
      inset: 0;
    }
    * { -webkit-tap-highlight-color: transparent; }

    /* Portrait mobile: rotate 90° so the 16:9 animation fills the screen sideways */
    @media (orientation: portrait) and (max-width: 820px) {
      #root {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 100vh;
        height: 100vw;
        transform: translate(-50%, -50%) rotate(90deg);
        transform-origin: center center;
      }
      #rotate-hint {
        display: flex !important;
      }
    }

    #rotate-hint {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000;
      color: #fff;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 18px;
      pointer-events: none;
      animation: hintFade 3.2s ease-out forwards;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
    #rotate-hint .icon {
      width: 44px;
      height: 70px;
      border: 1.5px solid #fff;
      border-radius: 6px;
      position: relative;
      animation: rotateNudge 1.6s ease-in-out infinite;
    }
    #rotate-hint .icon::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 6px;
      transform: translateX(-50%);
      width: 14px;
      height: 2px;
      background: rgba(255,255,255,0.6);
      border-radius: 1px;
    }
    #rotate-hint .label { color: rgba(255,255,255,0.7); }
    @keyframes rotateNudge {
      0%, 40%, 100% { transform: rotate(0); }
      70% { transform: rotate(90deg); }
    }
    @keyframes hintFade {
      0%, 70% { opacity: 1; }
      100% { opacity: 0; visibility: hidden; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="rotate-hint" aria-hidden="true">
    <div class="icon"></div>
    <div class="label">gire o celular</div>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel">
// =========================================================================
// animations.jsx — inlined
// =========================================================================

const Easing = {
  linear: (t) => t,
  easeInQuad:    (t) => t * t,
  easeOutQuad:   (t) => t * (2 - t),
  easeInOutQuad: (t) => (t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t),
  easeInCubic:    (t) => t * t * t,
  easeOutCubic:   (t) => (--t) * t * t + 1,
  easeInOutCubic: (t) => (t < 0.5 ? 4 * t * t * t : (t - 1) * (2 * t - 2) * (2 * t - 2) + 1),
  easeInQuart:    (t) => t * t * t * t,
  easeOutQuart:   (t) => 1 - (--t) * t * t * t,
  easeInOutQuart: (t) => (t < 0.5 ? 8 * t * t * t * t : 1 - 8 * (--t) * t * t * t),
  easeInExpo:  (t) => (t === 0 ? 0 : Math.pow(2, 10 * (t - 1))),
  easeOutExpo: (t) => (t === 1 ? 1 : 1 - Math.pow(2, -10 * t)),
  easeInOutExpo: (t) => {
    if (t === 0) return 0;
    if (t === 1) return 1;
    if (t < 0.5) return 0.5 * Math.pow(2, 20 * t - 10);
    return 1 - 0.5 * Math.pow(2, -20 * t + 10);
  },
  easeInSine:    (t) => 1 - Math.cos((t * Math.PI) / 2),
  easeOutSine:   (t) => Math.sin((t * Math.PI) / 2),
  easeInOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,
  easeOutBack: (t) => {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  },
  easeInBack: (t) => {
    const c1 = 1.70158, c3 = c1 + 1;
    return c3 * t * t * t - c1 * t * t;
  },
  easeInOutBack: (t) => {
    const c1 = 1.70158, c2 = c1 * 1.525;
    return t < 0.5
      ? (Math.pow(2 * t, 2) * ((c2 + 1) * 2 * t - c2)) / 2
      : (Math.pow(2 * t - 2, 2) * ((c2 + 1) * (t * 2 - 2) + c2) + 2) / 2;
  },
  easeOutElastic: (t) => {
    const c4 = (2 * Math.PI) / 3;
    if (t === 0) return 0;
    if (t === 1) return 1;
    return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
  },
};

const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

function interpolate(input, output, ease = Easing.linear) {
  return (t) => {
    if (t <= input[0]) return output[0];
    if (t >= input[input.length - 1]) return output[output.length - 1];
    for (let i = 0; i < input.length - 1; i++) {
      if (t >= input[i] && t <= input[i + 1]) {
        const span = input[i + 1] - input[i];
        const local = span === 0 ? 0 : (t - input[i]) / span;
        const easeFn = Array.isArray(ease) ? (ease[i] || Easing.linear) : ease;
        const eased = easeFn(local);
        return output[i] + (output[i + 1] - output[i]) * eased;
      }
    }
    return output[output.length - 1];
  };
}

function animate({ from = 0, to = 1, start = 0, end = 1, ease = Easing.easeInOutCubic }) {
  return (t) => {
    if (t <= start) return from;
    if (t >= end) return to;
    const local = (t - start) / (end - start);
    return from + (to - from) * ease(local);
  };
}

const TimelineContext = React.createContext({ time: 0, duration: 10, playing: false });
const useTime = () => React.useContext(TimelineContext).time;
const useTimeline = () => React.useContext(TimelineContext);

const SpriteContext = React.createContext({ localTime: 0, progress: 0, duration: 0 });
const useSprite = () => React.useContext(SpriteContext);

function Sprite({ start = 0, end = Infinity, children, keepMounted = false }) {
  const { time } = useTimeline();
  const visible = time >= start && time <= end;
  if (!visible && !keepMounted) return null;

  const duration = end - start;
  const localTime = Math.max(0, time - start);
  const progress = duration > 0 && isFinite(duration)
    ? clamp(localTime / duration, 0, 1)
    : 0;

  const value = { localTime, progress, duration, visible };

  return (
    <SpriteContext.Provider value={value}>
      {typeof children === 'function' ? children(value) : children}
    </SpriteContext.Provider>
  );
}

function Stage({
  width = 1280,
  height = 720,
  duration = 10,
  background = '#000',
  loop = true,
  autoplay = true,
  persistKey = 'animstage',
  children,
}) {
  const [time, setTime] = React.useState(0);
  const [playing, setPlaying] = React.useState(autoplay);
  const [hoverTime, setHoverTime] = React.useState(null);
  const [scale, setScale] = React.useState(1);

  const stageRef = React.useRef(null);
  const canvasRef = React.useRef(null);
  const rafRef = React.useRef(null);
  const lastTsRef = React.useRef(null);

  React.useEffect(() => {
    if (!stageRef.current) return;
    const el = stageRef.current;
    const measure = () => {
      const barH = 44;
      const s = Math.min(
        el.clientWidth / width,
        (el.clientHeight - barH) / height
      );
      setScale(Math.max(0.05, s));
    };
    measure();
    const ro = new ResizeObserver(measure);
    ro.observe(el);
    window.addEventListener('resize', measure);
    return () => { ro.disconnect(); window.removeEventListener('resize', measure); };
  }, [width, height]);

  React.useEffect(() => {
    if (!playing) { lastTsRef.current = null; return; }
    const step = (ts) => {
      if (lastTsRef.current == null) lastTsRef.current = ts;
      const dt = (ts - lastTsRef.current) / 1000;
      lastTsRef.current = ts;
      setTime((t) => {
        let next = t + dt;
        if (next >= duration) {
          if (loop) next = next % duration;
          else { next = duration; setPlaying(false); }
        }
        return next;
      });
      rafRef.current = requestAnimationFrame(step);
    };
    rafRef.current = requestAnimationFrame(step);
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); lastTsRef.current = null; };
  }, [playing, duration, loop]);

  React.useEffect(() => {
    const onKey = (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (e.code === 'Space') { e.preventDefault(); setPlaying(p => !p); }
      else if (e.code === 'ArrowLeft') setTime(t => clamp(t - (e.shiftKey ? 1 : 0.1), 0, duration));
      else if (e.code === 'ArrowRight') setTime(t => clamp(t + (e.shiftKey ? 1 : 0.1), 0, duration));
      else if (e.key === '0' || e.code === 'Home') setTime(0);
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [duration]);

  const displayTime = hoverTime != null ? hoverTime : time;
  const ctxValue = React.useMemo(
    () => ({ time: displayTime, duration, playing, setTime, setPlaying }),
    [displayTime, duration, playing]
  );

  return (
    <div ref={stageRef} style={{
      position: 'absolute', inset: 0,
      display: 'flex', flexDirection: 'column',
      alignItems: 'center',
      background: '#000',
      fontFamily: '"Helvetica Neue", Helvetica, Arial, sans-serif',
    }}>
      <div style={{
        flex: 1, width: '100%',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        overflow: 'hidden', minHeight: 0,
      }}>
        <div ref={canvasRef} style={{
          width, height,
          background,
          position: 'relative',
          transform: `scale(${scale})`,
          transformOrigin: 'center',
          flexShrink: 0,
          overflow: 'hidden',
        }}>
          <TimelineContext.Provider value={ctxValue}>
            {children}
          </TimelineContext.Provider>
        </div>
      </div>
      <PlaybackBar
        time={displayTime}
        duration={duration}
        playing={playing}
        onPlayPause={() => setPlaying(p => !p)}
        onReset={() => setTime(0)}
        onSeek={(t) => setTime(t)}
        onHover={(t) => setHoverTime(t)}
      />
    </div>
  );
}

function PlaybackBar({ time, duration, playing, onPlayPause, onReset, onSeek, onHover }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);

  const timeFromEvent = React.useCallback((e) => {
    const rect = trackRef.current.getBoundingClientRect();
    const x = clamp((e.clientX - rect.left) / rect.width, 0, 1);
    return x * duration;
  }, [duration]);

  const onTrackMove = (e) => {
    if (!trackRef.current) return;
    const t = timeFromEvent(e);
    if (dragging) onSeek(t);
    else onHover(t);
  };

  const onTrackLeave = () => { if (!dragging) onHover(null); };
  const onTrackDown = (e) => { setDragging(true); onSeek(timeFromEvent(e)); onHover(null); };

  React.useEffect(() => {
    if (!dragging) return;
    const onUp = () => setDragging(false);
    const onMove = (e) => { if (trackRef.current) onSeek(timeFromEvent(e)); };
    window.addEventListener('mouseup', onUp);
    window.addEventListener('mousemove', onMove);
    return () => { window.removeEventListener('mouseup', onUp); window.removeEventListener('mousemove', onMove); };
  }, [dragging, timeFromEvent, onSeek]);

  const pct = duration > 0 ? (time / duration) * 100 : 0;
  const fmt = (t) => {
    const total = Math.max(0, t);
    const m = Math.floor(total / 60);
    const s = Math.floor(total % 60);
    const cs = Math.floor((total * 100) % 100);
    return `${String(m).padStart(1,'0')}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;
  };
  const mono = 'ui-monospace, "SF Mono", Menlo, Consolas, monospace';

  return (
    <div style={{
      display: 'flex', alignItems: 'center', gap: 12,
      padding: '8px 16px',
      background: 'rgba(20,20,20,0.95)',
      borderTop: '1px solid rgba(255,255,255,0.08)',
      width: '100%',
      maxWidth: 680,
      alignSelf: 'center',
      borderRadius: 8,
      color: '#fff',
      fontFamily: '"Helvetica Neue", Helvetica, Arial, sans-serif',
      userSelect: 'none',
      flexShrink: 0,
    }}>
      <IconButton onClick={onReset} title="Voltar ao início">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M3 2v10M12 2L5 7l7 5V2z" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round"/>
        </svg>
      </IconButton>
      <IconButton onClick={onPlayPause} title="Play/pause (espaço)">
        {playing ? (
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <rect x="3" y="2" width="3" height="10" fill="currentColor"/>
            <rect x="8" y="2" width="3" height="10" fill="currentColor"/>
          </svg>
        ) : (
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M3 2l9 5-9 5V2z" fill="currentColor"/>
          </svg>
        )}
      </IconButton>
      <div style={{ fontFamily: mono, fontSize: 12, fontVariantNumeric: 'tabular-nums', width: 64, textAlign: 'right', color: '#fff' }}>
        {fmt(time)}
      </div>
      <div
        ref={trackRef}
        onMouseMove={onTrackMove}
        onMouseLeave={onTrackLeave}
        onMouseDown={onTrackDown}
        style={{ flex: 1, height: 22, position: 'relative', cursor: 'pointer', display: 'flex', alignItems: 'center' }}
      >
        <div style={{ position: 'absolute', left: 0, right: 0, height: 4, background: 'rgba(255,255,255,0.12)', borderRadius: 2 }}/>
        <div style={{ position: 'absolute', left: 0, width: `${pct}%`, height: 4, background: '#C5F82A', borderRadius: 2 }}/>
        <div style={{ position: 'absolute', left: `${pct}%`, top: '50%', width: 12, height: 12, marginLeft: -6, marginTop: -6, background: '#fff', borderRadius: 6, boxShadow: '0 2px 4px rgba(0,0,0,0.4)' }}/>
      </div>
      <div style={{ fontFamily: mono, fontSize: 12, fontVariantNumeric: 'tabular-nums', width: 64, textAlign: 'left', color: 'rgba(255,255,255,0.45)' }}>
        {fmt(duration)}
      </div>
    </div>
  );
}

function IconButton({ children, onClick, title }) {
  const [hover, setHover] = React.useState(false);
  return (
    <button onClick={onClick} title={title}
      onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
      style={{
        width: 28, height: 28,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        background: hover ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.04)',
        border: '1px solid rgba(255,255,255,0.1)',
        borderRadius: 6, color: '#fff', cursor: 'pointer', padding: 0,
        transition: 'background 120ms',
      }}
    >{children}</button>
  );
}

// =========================================================================
// scenes.jsx — inlined
// =========================================================================

const W = 1280;
const H = 720;
const CX = W / 2;
const CY = H / 2;

const helv = '"Helvetica Neue", Helvetica, Arial, sans-serif';
const mono = 'ui-monospace, "SF Mono", Menlo, Consolas, monospace';

function Circle({ x, y, r, fill = 'transparent', stroke = null, strokeWidth = 1, opacity = 1 }) {
  return (
    <div style={{
      position: 'absolute', left: x - r, top: y - r,
      width: r * 2, height: r * 2,
      borderRadius: '50%',
      background: fill,
      border: stroke ? `${strokeWidth}px solid ${stroke}` : 'none',
      opacity, boxSizing: 'border-box',
    }} />
  );
}

function Box({ x, y, w, h, radius = 0, stroke = '#fff', strokeWidth = 1.5, fill = 'transparent', opacity = 1, children, clip = false }) {
  return (
    <div style={{
      position: 'absolute', left: x - w / 2, top: y - h / 2,
      width: w, height: h, borderRadius: radius,
      border: stroke ? `${strokeWidth}px solid ${stroke}` : 'none',
      background: fill, opacity, boxSizing: 'border-box',
      overflow: clip ? 'hidden' : 'visible',
    }}>{children}</div>
  );
}

function Arrow({ x1, y1, x2, y2, color = '#fff', opacity = 1, head = 9 }) {
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.hypot(dx, dy);
  const ang = Math.atan2(dy, dx);
  return (
    <>
      <div style={{
        position: 'absolute', left: x1, top: y1 - 0.5,
        width: Math.max(0, len - head), height: 1,
        background: color, opacity,
        transform: `rotate(${ang}rad)`, transformOrigin: '0 50%',
      }} />
      <div style={{
        position: 'absolute', left: x2, top: y2,
        width: 0, height: 0,
        borderLeft: `${head}px solid ${color}`,
        borderTop: `${head * 0.6}px solid transparent`,
        borderBottom: `${head * 0.6}px solid transparent`,
        transform: `translate(-${head}px, -${head * 0.6}px) rotate(${ang}rad)`,
        transformOrigin: `${head}px ${head * 0.6}px`,
        opacity,
      }} />
    </>
  );
}

function Kicker({ children, x, y, color = 'rgba(255,255,255,0.45)', size = 11, op = 1 }) {
  return (
    <div style={{
      position: 'absolute', left: x, top: y,
      transform: 'translate(-50%, -50%)',
      fontFamily: mono, fontSize: size,
      letterSpacing: '0.22em', textTransform: 'uppercase',
      color, opacity: op, whiteSpace: 'nowrap',
    }}>{children}</div>
  );
}

function Headline({ children, x, y, size = 56, weight = 500, color = '#fff', op = 1, align = 'center', maxW = 1000, ls = '-0.04em' }) {
  const tx = align === 'center' ? '-50%' : align === 'right' ? '-100%' : '0';
  return (
    <div style={{
      position: 'absolute', left: x, top: y,
      transform: `translate(${tx}, 0)`,
      fontFamily: helv, fontSize: size, fontWeight: weight,
      letterSpacing: ls, color, opacity: op,
      textAlign: align, lineHeight: 1.05, maxWidth: maxW,
    }}>{children}</div>
  );
}

function Body({ children, x, y, size = 20, color = 'rgba(255,255,255,0.6)', op = 1, align = 'center', maxW = 800, weight = 300 }) {
  const tx = align === 'center' ? '-50%' : align === 'right' ? '-100%' : '0';
  return (
    <div style={{
      position: 'absolute', left: x, top: y,
      transform: `translate(${tx}, 0)`,
      fontFamily: helv, fontSize: size, fontWeight: weight,
      letterSpacing: '-0.005em', color, opacity: op,
      textAlign: align, lineHeight: 1.35, maxWidth: maxW,
    }}>{children}</div>
  );
}

function Person({ x, y, scale = 1, opacity = 1, fill = '#fff' }) {
  const headR = 11 * scale, bodyW = 32 * scale, bodyH = 22 * scale;
  return (
    <>
      <Circle x={x} y={y - headR - 2} r={headR} fill={fill} opacity={opacity} />
      <div style={{
        position: 'absolute', left: x - bodyW / 2, top: y + 4,
        width: bodyW, height: bodyH,
        background: fill, opacity,
        borderTopLeftRadius: bodyW / 2, borderTopRightRadius: bodyW / 2,
        borderBottomLeftRadius: 4, borderBottomRightRadius: 4,
      }} />
    </>
  );
}

function Phone({ x, y, w = 200, h = 380, opacity = 1, children }) {
  return (
    <Box x={x} y={y} w={w} h={h} radius={26} stroke="#fff" strokeWidth={1.5} opacity={opacity} clip>
      <div style={{
        position: 'absolute', left: '50%', top: 14,
        transform: 'translateX(-50%)',
        width: 56, height: 6, borderRadius: 3,
        background: 'rgba(255,255,255,0.5)',
      }} />
      {children}
    </Box>
  );
}

function Computer({ x, y, w = 460, h = 280, opacity = 1, children }) {
  return (
    <>
      <Box x={x} y={y} w={w} h={h} radius={8} stroke="#fff" strokeWidth={1.5} opacity={opacity} clip>
        {children}
      </Box>
      <div style={{ position: 'absolute', left: x - 5, top: y + h / 2, width: 10, height: 26, background: '#fff', opacity }} />
      <div style={{ position: 'absolute', left: x - 60, top: y + h / 2 + 24, width: 120, height: 4, borderRadius: 2, background: '#fff', opacity }} />
    </>
  );
}

function Robot({ x, y, scale = 1, opacity = 1, eyeOpen = 1, antennaPulse = 1 }) {
  const w = 200 * scale, h = 170 * scale;
  return (
    <>
      <div style={{ position: 'absolute', left: x - 0.75, top: y - h / 2 - 28, width: 1.5, height: 28, background: '#fff', opacity }} />
      <Circle x={x} y={y - h / 2 - 32} r={5 * antennaPulse} fill="#fff" opacity={opacity} />
      <Circle x={x} y={y - h / 2 - 32} r={11} stroke="rgba(255,255,255,0.4)" strokeWidth={1} opacity={opacity * antennaPulse * 0.6} />
      <Box x={x} y={y} w={w} h={h} radius={18} stroke="#fff" strokeWidth={1.5} opacity={opacity} />
      <div style={{ position: 'absolute', left: x - 38 * scale - 11 * scale, top: y - 14 * scale - 11 * scale * eyeOpen, width: 22 * scale, height: 22 * scale * eyeOpen, borderRadius: '50%', background: '#fff', opacity }} />
      <div style={{ position: 'absolute', left: x + 38 * scale - 11 * scale, top: y - 14 * scale - 11 * scale * eyeOpen, width: 22 * scale, height: 22 * scale * eyeOpen, borderRadius: '50%', background: '#fff', opacity }} />
      <div style={{ position: 'absolute', left: x - 30 * scale, top: y + 30 * scale, width: 60 * scale, height: 4, borderRadius: 2, background: '#fff', opacity }} />
    </>
  );
}

function Camera({ x, y, scale = 1, opacity = 1 }) {
  const w = 220 * scale, h = 150 * scale;
  return (
    <>

function SceneSistema() {
  const { progress, localTime } = useSprite();
  const exitOp = 1 - clamp((progress - 0.94) / 0.06, 0, 1);
  const y = CY + 30;
  const nodes = [
    { kind: 'phone',   x: 200,  label: 'TRÁFEGO', sub: '01' },
    { kind: 'monitor', x: 510,  label: 'SITE',     sub: '02' },
    { kind: 'robot',   x: 800,  label: 'IA',       sub: '03' },
    { kind: 'camera',  x: 1080, label: 'VÍDEO',    sub: '04' },
  ];
  const revealAt = (i) => clamp((progress - 0.02 - i * 0.08) / 0.10, 0, 1);
  const arrowAt  = (i) => clamp((progress - 0.08 - i * 0.08) / 0.10, 0, 1);
  const headOp = clamp((progress - 0.50) / 0.12, 0, 1);
  const tagOp  = clamp((progress - 0.66) / 0.12, 0, 1);
  const ctaOp  = clamp((progress - 0.80) / 0.12, 0, 1);
  const ctaPulse = 0.6 + Math.abs(Math.sin(localTime * 2)) * 0.4;
  const flowT = (localTime % 4) / 4;
  const segP = flowT * 3, seg = Math.floor(segP), segLocal = segP - seg;
  const flowX = seg < 3 ? nodes[seg].x + (nodes[Math.min(seg+1,3)].x - nodes[seg].x) * segLocal : nodes[3].x;
  const flowVisible = progress > 0.55;
  return (
    <>
      <Kicker x={CX} y={70}>O SISTEMA</Kicker>
      {nodes.map((n, i) => {
        const op = revealAt(i) * exitOp;
        let icon = null;
        if (n.kind === 'phone')   icon = <Phone x={n.x} y={y} w={90} h={150} opacity={op} />;
        if (n.kind === 'monitor') icon = <Computer x={n.x} y={y - 12} w={170} h={110} opacity={op} />;
        if (n.kind === 'robot')   icon = <Robot x={n.x} y={y} scale={0.55} opacity={op} eyeOpen={1} antennaPulse={1} />;
        if (n.kind === 'camera')  icon = <Camera x={n.x} y={y} scale={0.65} opacity={op} />;
        return (
          <React.Fragment key={n.kind}>
            {icon}
            <Kicker x={n.x} y={y + 110} size={11} color="rgba(255,255,255,0.55)" op={op}>{n.sub}</Kicker>
            <div style={{ position: 'absolute', left: n.x, top: y + 130, transform: 'translate(-50%, 0)', fontFamily: helv, fontSize: 22, fontWeight: 500, letterSpacing: '-0.02em', color: '#fff', opacity: op, whiteSpace: 'nowrap' }}>{n.label}</div>
          </React.Fragment>
        );
      })}
      {[0, 1, 2].map((i) => {
        const op = arrowAt(i) * exitOp;
        const offsets = [50, 95, 65], offsetsRight = [95, 65, 80];
        const x1 = nodes[i].x + offsets[i], x2 = nodes[i + 1].x - offsetsRight[i];
        return <Arrow key={i} x1={x1} y1={y} x2={x2} y2={y} color="rgba(255,255,255,0.7)" opacity={op} head={8} />;
      })}
      {flowVisible && <>
        <Circle x={flowX} y={y} r={5} fill="#fff" opacity={exitOp} />
        <Circle x={flowX} y={y} r={11} stroke="rgba(255,255,255,0.4)" opacity={exitOp * 0.8} />
      </>}
      <Headline x={CX} y={120} size={48} op={headOp * exitOp} maxW={1100}>Quatro passos. Um sistema.</Headline>
      <Body x={CX} y={195} size={17} op={tagOp * exitOp} maxW={680}>O lead que entra pelo anúncio sai com proposta na mão. Sem você apertar nada.</Body>
      <div style={{ position: 'absolute', left: CX, top: H - 130, transform: 'translate(-50%, 0)', opacity: ctaOp * exitOp }}>
        <div style={{ padding: '16px 32px', border: '1.5px solid #fff', borderRadius: 4, fontFamily: helv, fontSize: 17, fontWeight: 500, color: '#fff', letterSpacing: '0.02em', boxShadow: `0 0 ${20 * ctaPulse}px rgba(255,255,255,${0.15 * ctaPulse})`, background: 'rgba(255,255,255,0.04)' }}>
          Falar com um especialista &nbsp;→
        </div>
      </div>
    </>
  );
}

function CornerTick({ x, y, dx, dy }) {
  const len = 14;
  return (
    <>
      <div style={{ position: 'absolute', left: dx > 0 ? x : x + dx * len, top: y - 0.5, width: len, height: 1, background: 'rgba(255,255,255,0.4)' }} />
      <div style={{ position: 'absolute', left: x - 0.5, top: dy > 0 ? y : y + dy * len, width: 1, height: len, background: 'rgba(255,255,255,0.4)' }} />
    </>
  );
}

function StageChrome() {
  const time = useTime();
  const { duration } = useTimeline();
  const fmt = (t) => {
    const m = Math.floor(t / 60), s = Math.floor(t % 60), cs = Math.floor((t * 100) % 100);
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}:${String(cs).padStart(2,'0')}`;
  };
  const step = (() => {
    if (time < T.intro[1])    return '00 / INTRO';
    if (time < T.trafego[1])  return '01 / TRÁFEGO PAGO';
    if (time < T.site[1])     return '02 / SITE INTERATIVO';
    if (time < T.ia[1])       return '03 / IA & AUTOMAÇÃO';
    if (time < T.video[1])    return '04 / EDIÇÃO DE VÍDEO';
    return '— / SISTEMA';
  })();
  return (
    <>
      <CornerTick x={28} y={28} dx={1} dy={1} />
      <CornerTick x={W - 28} y={28} dx={-1} dy={1} />
      <CornerTick x={28} y={H - 28} dx={1} dy={-1} />
      <CornerTick x={W - 28} y={H - 28} dx={-1} dy={-1} />
      <div style={{ position: 'absolute', left: 48, top: 28, fontFamily: mono, fontSize: 10, letterSpacing: '0.22em', color: 'rgba(255,255,255,0.4)', textTransform: 'uppercase' }}>◯ &nbsp; COMO FUNCIONA</div>
      <div style={{ position: 'absolute', right: 48, top: 28, fontFamily: mono, fontSize: 10, letterSpacing: '0.22em', color: 'rgba(255,255,255,0.4)', fontVariantNumeric: 'tabular-nums' }}>T+ {fmt(time)}</div>
      <div style={{ position: 'absolute', left: 48, bottom: 28, fontFamily: mono, fontSize: 10, letterSpacing: '0.22em', color: 'rgba(255,255,255,0.4)', textTransform: 'uppercase' }}>{step}</div>
      <div style={{ position: 'absolute', right: 48, bottom: 28, fontFamily: mono, fontSize: 10, letterSpacing: '0.22em', color: 'rgba(255,255,255,0.4)', fontVariantNumeric: 'tabular-nums' }}>{fmt(duration)}</div>
    </>
  );
}

const T = { intro: [0,6], trafego: [6,15], site: [15,25], ia: [25,35], video: [35,43], sistema: [43,53] };

function App() {
  return (
    <Stage width={W} height={H} duration={53} background="#000" persistKey="como-funciona-v1">
      <StageChrome />
      <Sprite start={T.intro[0]}   end={T.intro[1]}>   <SceneIntro /></Sprite>
      <Sprite start={T.trafego[0]} end={T.trafego[1]}> <SceneTrafego /></Sprite>
      <Sprite start={T.site[0]}    end={T.site[1]}>    <SceneSite /></Sprite>
      <Sprite start={T.ia[0]}      end={T.ia[1]}>      <SceneIA /></Sprite>
      <Sprite start={T.video[0]}   end={T.video[1]}>   <SceneVideo /></Sprite>
      <Sprite start={T.sistema[0]} end={T.sistema[1]}> <SceneSistema /></Sprite>
    </Stage>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
